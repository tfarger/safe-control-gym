hpo_config:

  load_if_exists: True # this should set to True if hpo is run in parallel
  objective: [exponentiated_rmse, exponentiated_rms_action_change] # [other metrics defined in base_experiment.py]
  objective_bounds: [[0.0, 1.0], [0.0, 1.0]] # [bounds for each objective]. Worse value will be assigned if objective evaluation is None
  direction: [maximize, maximize] # [minimize, maximize]
  repetitions: 5 # number of samples of performance for each objective query
  n_episodes: 5 # number of episodes to evaluate each policy
  use_gpu: True
  seed: 24
  save_n_best_hps: 1
  # budget
  trials: 60
  hp_eval_list: ['proc_ns=5']

  # hyperparameters
  hps_config:
    # model args
    hidden_dim: 64
    activation: relu

    # loss args
    gamma: 0.98
    gae_lambda: 0.92
    clip_param: 0.2
    target_kl: 0.01
    entropy_coef: 0.002
    quantile_count: 256

    # optim args
    opt_epochs: 20
    mini_batch_size: 256
    actor_lr: 0.001
    critic_lr: 0.001

    # runner args
    max_env_steps: 660000
    rollout_batch_size: 5

    # objective
    rew_state_weight: [3., .1, 3., .1, .1, 0.001]
    rew_act_weight: [.1, .1]
  proc_ns=5:
    activation: tanh
    actor_lr: 1.0e-05
    clip_param: 0.2
    critic_lr: 0.0007641108214685
    entropy_coef: 3.946225412792475e-05
    gae_lambda: 0.92
    gamma: 0.98
    hidden_dim: 256
    max_env_steps: 456000
    mini_batch_size: 128
    opt_epochs: 20
    quantile_count: 256
    rew_act_weight:
    - 9.516267312336597
    - 10.298451892439441
    rew_state_weight:
    - 1.3998466841749142
    - 0.5022003681625099
    - 8.728836153075454
    - 4.393369686368549
    - 1.3417117604034574
    - 5.822283989262226
    rollout_batch_size: 3
    target_kl: 0.3225293377462848
