algo: fmpc_socp
algo_config:
  horizon: 40
  r_mpc:
    - 1.0e-6
    - 1.0e-6
  q_mpc: 
    - 50
    - 0.001
    - 0.1
    - 0.001
    - 50
    - 0.001
    - 0.1
    - 0.001
  # Prior info
  prior_info:
    prior_prop: null
    randomize_prior_prop: False
    prior_prop_rand_info: null
  warmstart: True
  solver: qrqp
  use_full_flat_reference: True
  use_acados: False

  socp_config:
    beta_sqrt:
      - 2
      - 2
    slack_weight_stability: 25.0
    slack_weight_dyn_ext: 250000.0
    input_bound:
      - 3
      - 0.6
    thrust_max: 0.6

  flat_state_constraint:
    h_vect: [-1, 0, 0, 0, 0, 0, 0, 0]
    b_val: 1.2
    quantile: 5 # rho(delta) in safety filter